name: PC criado pelo @alves7.pcm - Windows 11 26H2 ARM64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secure-rdp:
    runs-on: [self-hosted, Windows, ARM64, windows-11-26H2]
    timeout-minutes: 360

    steps:
      # 1. REPOSITORIO
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. VERIFICAR WINDOWS E HARDWARE
      - name: Verify Windows 11 26H2 ARM64
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $os = Get-CimInstance Win32_OperatingSystem
          $computer = Get-CimInstance Win32_ComputerSystem

          Write-Host "======================================"
          Write-Host "INFORMACOES DO SISTEMA"
          Write-Host "======================================"
          Write-Host "Sistema: $($os.Caption)"
          Write-Host "Versao: $($os.Version)"
          Write-Host "Build: $($os.BuildNumber)"
          Write-Host "Arquitetura: $($os.OSArchitecture)"
          Write-Host "Fabricante: $($computer.Manufacturer)"
          Write-Host "Modelo: $($computer.Model)"
          Write-Host "RAM GB: $([math]::Round($computer.TotalPhysicalMemory / 1GB, 2))"

          Get-CimInstance Win32_Processor |
            Select-Object Name, NumberOfCores, NumberOfLogicalProcessors |
            Format-Table -AutoSize

          if ($os.Caption -notmatch "Windows 11") {
            throw "O runner nao esta executando Windows 11."
          }

          if ([int]$os.BuildNumber -lt 26300 -or
              [int]$os.BuildNumber -ge 26400) {
            throw "Build nao reconhecida como familia 26H2 esperada (26300)."
          }

          if ($os.OSArchitecture -notmatch "ARM") {
            throw "O runner nao e ARM64."
          }

          Write-Host "Verificacao do sistema concluida."

      # 3. ATIVAR RDP
      - name: Enable Remote Desktop
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          Set-ItemProperty `
            -Path "HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService

          Get-NetFirewallRule -DisplayGroup "Remote Desktop" |
            Enable-NetFirewallRule

          Write-Host "RDP configurado."

      # 4. CRIAR CONTA RDP
      - name: Create RDP User
        shell: powershell
        env:
          RDP_USERNAME: "Rafael"
          RDP_PASSWORD: "P@ssw0rd!"
        run: |
          $ErrorActionPreference = "Stop"

          $username = $env:RDP_USERNAME
          $securePassword = ConvertTo-SecureString `
            $env:RDP_PASSWORD -AsPlainText -Force

          $user = Get-LocalUser -Name $username `
            -ErrorAction SilentlyContinue

          if ($null -eq $user) {
            New-LocalUser `
              -Name $username `
              -Password $securePassword `
              -FullName $username `
              -Description "Conta RDP" `
              -PasswordNeverExpires | Out-Null
          } else {
            Set-LocalUser `
              -Name $username `
              -Password $securePassword
          }

          foreach ($group in @("Administrators", "Remote Desktop Users")) {
            try {
              Add-LocalGroupMember `
                -Group $group `
                -Member $username `
                -ErrorAction Stop
            } catch {
              $members = Get-LocalGroupMember `
                -Group $group `
                -ErrorAction SilentlyContinue

              if ($members.Name -notcontains "$env:COMPUTERNAME\$username") {
                throw "Nao foi possivel configurar o grupo $group."
              }
            }
          }

          Write-Host "Usuario RDP configurado: $username"

      # 5. VERIFICAR REDE
      - name: Check Network Connectivity
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          foreach ($hostName in @(
            "pkgs.tailscale.com",
            "controlplane.tailscale.com"
          )) {
            Write-Host "Testando $hostName"

            Test-NetConnection `
              -ComputerName $hostName `
              -Port 443 `
              -WarningAction SilentlyContinue |
              Select-Object ComputerName, RemotePort, TcpTestSucceeded
          }

      # 6. INSTALAR TAILSCALE ARM64
      - name: Install Tailscale ARM64
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"

          $msiPath = Join-Path $env:TEMP "tailscale-arm64.msi"

          Write-Host "Baixando Tailscale ARM64..."

          Invoke-WebRequest `
            -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-arm64.msi" `
            -OutFile $msiPath

          if (!(Test-Path $msiPath) -or
              (Get-Item $msiPath).Length -lt 1MB) {
            throw "Instalador Tailscale invalido."
          }

          $process = Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList "/i `"$msiPath`" /quiet /norestart" `
            -Wait `
            -PassThru

          if ($process.ExitCode -notin @(0, 3010)) {
            throw "Falha na instalacao Tailscale: $($process.ExitCode)"
          }

          $tsExe = @(
            "$env:ProgramFiles\Tailscale\tailscale.exe",
            "${env:ProgramFiles(x86)}\Tailscale\tailscale.exe"
          ) |
            Where-Object { $_ -and (Test-Path $_) } |
            Select-Object -First 1

          if (!$tsExe) {
            throw "tailscale.exe nao encontrado."
          }

          "TAILSCALE_EXE=$tsExe" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          & $tsExe version

      # 7. CONECTAR TAILSCALE
      - name: Connect Tailscale
        shell: powershell
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
            throw "Configure TAILSCALE_AUTH_KEY nos secrets do repositorio."
          }

          $tsExe = $env:TAILSCALE_EXE

          if (!$tsExe -or !(Test-Path $tsExe)) {
            throw "Executavel Tailscale nao encontrado."
          }

          $hostname = "rafael-rdp-${{ github.run_id }}"

          $service = Get-Service -Name "Tailscale" `
            -ErrorAction SilentlyContinue

          if (!$service) {
            throw "Servico Tailscale nao encontrado."
          }

          Set-Service -Name "Tailscale" -StartupType Automatic

          if ($service.Status -ne "Running") {
            Start-Service -Name "Tailscale"
          }

          $ready = $false

          for ($i = 1; $i -le 12; $i++) {
            Start-Sleep -Seconds 5
            $service = Get-Service -Name "Tailscale" `
              -ErrorAction SilentlyContinue

            if ($service -and $service.Status -eq "Running") {
              $ready = $true
              break
            }

            Write-Host "Aguardando Tailscale ($i/12)..."
          }

          if (!$ready) {
            throw "Servico Tailscale nao iniciou."
          }

          & $tsExe up `
            "--auth-key=$env:TAILSCALE_AUTH_KEY" `
            "--hostname=$hostname" `
            "--accept-dns=false" `
            "--unattended"

          if ($LASTEXITCODE -ne 0) {
            throw "Falha ao conectar Tailscale."
          }

          $ip = $null

          for ($i = 1; $i -le 24; $i++) {
            Start-Sleep -Seconds 5

            $ipOutput = & $tsExe ip -4 2>$null

            if ($LASTEXITCODE -eq 0 -and $ipOutput) {
              $candidate = ($ipOutput | Select-Object -First 1).ToString().Trim()

              if ($candidate -match '^\d{1,3}(\.\d{1,3}){3}$') {
                $ip = $candidate
                break
              }
            }

            Write-Host "Aguardando IP Tailscale ($i/24)..."
          }

          if (!$ip) {
            & $tsExe status
            throw "Tailscale conectado sem IP IPv4 disponivel."
          }

          "TAILSCALE_IPV4=$ip" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          "TAILSCALE_HOSTNAME=$hostname" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "Tailscale conectado."
          Write-Host "Hostname: $hostname"
          Write-Host "IP: $ip"

      # 8. INSTALAR GOOGLE CHROME
      - name: Install Google Chrome
        continue-on-error: true
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          if (Get-Command winget -ErrorAction SilentlyContinue) {
            winget install `
              --id Google.Chrome `
              --exact `
              --silent `
              --accept-package-agreements `
              --accept-source-agreements
          } else {
            Write-Host "winget nao disponivel."
          }

      # 9. INSTALAR 7-ZIP
      - name: Install 7-Zip
        continue-on-error: true
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          if (Get-Command winget -ErrorAction SilentlyContinue) {
            winget install `
              --id 7zip.7zip `
              --exact `
              --silent `
              --accept-package-agreements `
              --accept-source-agreements
          } else {
            Write-Host "winget nao disponivel."
          }

      # 10. VERIFICAR RDP E TAILSCALE
      - name: Verify RDP and Tailscale
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"

          Get-Service -Name TermService |
            Select-Object Name, Status, StartType

          $rdp = Test-NetConnection `
            -ComputerName "127.0.0.1" `
            -Port 3389 `
            -WarningAction SilentlyContinue

          Write-Host "Porta 3389 acessivel localmente: $($rdp.TcpTestSucceeded)"

          $tsExe = $env:TAILSCALE_EXE

          if ($tsExe -and (Test-Path $tsExe)) {
            & $tsExe status
            & $tsExe ip -4
          } else {
            Write-Host "Executavel Tailscale indisponivel."
          }

      # 11. RELATORIO FINAL
      - name: Final RDP Report
        if: always()
        shell: powershell
        env:
          RDP_USERNAME: "Rafael"
          RDP_PASSWORD: "P@ssw0rd!"
        run: |
          Write-Host ""
          Write-Host "======================================"
          Write-Host "          RELATORIO RDP"
          Write-Host "======================================"

          $os = Get-CimInstance Win32_OperatingSystem

          Write-Host "Sistema: $($os.Caption)"
          Write-Host "Versao: $($os.Version)"
          Write-Host "Build: $($os.BuildNumber)"
          Write-Host "Arquitetura: $($os.OSArchitecture)"
          Write-Host "Usuario: $env:RDP_USERNAME"
          Write-Host "Senha: $env:RDP_PASSWORD"
          Write-Host "Hostname Tailscale: $env:TAILSCALE_HOSTNAME"
          Write-Host "IP Tailscale: $env:TAILSCALE_IPV4"
          Write-Host "Status do job: ${{ job.status }}"
          Write-Host "======================================"

      # 12. MANTER O JOB ATIVO
      - name: Keep Alive
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $end = (Get-Date).AddMinutes(330)

          Write-Host "Mantendo a maquina ativa ate: $end"

          while ((Get-Date) -lt $end) {
            Start-Sleep -Seconds 60

            $remaining = [math]::Round(
              ($end - (Get-Date)).TotalMinutes, 1
            )

            Write-Host "Tempo restante: $remaining minutos"
          }

          Write-Host "Periodo de execucao concluido."
